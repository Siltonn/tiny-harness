[project]
name = "tiny-harness"
version = "0.1.0"
description = "A tiny LLM agent harness for learning and research"
readme = "README.md"
authors = [
    { name = "elmer", email = "elmerzhai@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
tiny-harness = "tiny_harness.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
